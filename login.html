<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your STACKLY Rehabilitation Portal - Client and Administrator Access.">
  <title>Login | STACKLY Rehabilitation</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="assets/Brand-logo.webp">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      background: radial-gradient(circle at 10% 20%, rgba(213, 167, 122, 0.08) 0%, rgba(244, 243, 236, 1) 60%);
      position: relative;
    }

    .auth-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-text-main);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform var(--transition-fast), color var(--transition-fast);
    }

    .back-home-link:hover {
      color: var(--color-primary);
      transform: translateX(-4px);
    }

    .auth-header-logo img {
      height: 40px;
      width: auto;
    }

    .auth-center-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 2.5rem 1rem;
    }

    .auth-card-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: clamp(2rem, 5vw, 2.75rem);
      box-shadow: 0 20px 45px rgba(40, 91, 80, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(229, 227, 216, 0.8);
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-card-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--color-primary-dark);
      margin-bottom: 0.35rem;
      font-family: var(--font-sans);
    }

    .auth-card-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-bottom: 0;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 0.85rem 2.85rem 0.85rem 2.85rem;
      background-color: #FFFFFF;
      border: 1.5px solid var(--color-bg-border);
      border-radius: var(--radius-md);
      color: var(--color-text-main);
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .select-wrapper select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), 0.15);
    }

    .select-caret {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      font-size: 0.85rem;
    }

    .password-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .forgot-pass-link {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--color-primary);
      text-decoration: none;
    }

    .forgot-pass-link:hover {
      color: var(--color-accent-dark);
      text-decoration: underline;
    }

    .btn-auth-submit {
      width: 100%;
      background-color: #0E1715;
      color: #FFFFFF;
      padding: 0.95rem 1.5rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .btn-auth-submit:hover, .btn-auth-submit:focus-visible {
      background-color: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 91, 80, 0.25);
    }

    .auth-bottom-prompt {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
    }

    .auth-bottom-prompt a {
      font-weight: 600;
      color: var(--color-primary);
    }

    .auth-bottom-prompt a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-page-wrapper {
        padding: 1.25rem 1rem;
      }
      .auth-card-container {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body class="no-overflow">

  <div class="auth-page-wrapper">
    <!-- Top Bar with Back and Logo -->
    <header class="auth-header-top">
      <a href="index.html" class="back-home-link" id="link-back-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <div class="auth-header-logo">
        <a href="index.html" aria-label="STACKLY Home">
          <img src="assets/Brand-logo.webp" alt="STACKLY Rehabilitation" class="brand-logo-img">
        </a>
      </div>
    </header>

    <!-- Center Login Card -->
    <main class="auth-center-stage">
      <div class="auth-card-container">
        <div class="auth-card-header">
          <h1 class="auth-card-title">Welcome Back</h1>
          <p class="auth-card-subtitle">Sign in to your account</p>
        </div>

        <form id="login-form" novalidate>
          <!-- Login As Dropdown -->
          <div class="form-group">
            <label for="login-role" class="form-label">Login As</label>
            <div class="select-wrapper input-with-icon">
              <i class="fa-regular fa-user input-icon"></i>
              <select id="login-role" name="role" required>
                <option value="Client" selected>Client</option>
                <option value="Admin">Admin</option>
                <option value="Therapist">Therapist</option>
              </select>
              <i class="fa-solid fa-chevron-down select-caret"></i>
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
            </div>
            <div class="form-feedback" id="email-error"></div>
          </div>

          <!-- Password with Toggle & Forgot Password -->
          <div class="form-group">
            <div class="password-label-row">
              <label for="login-password" class="form-label" style="margin-bottom:0;">Password</label>
              <a href="404.html" class="forgot-pass-link" id="link-forgot-pass">Forgot password?</a>
            </div>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="form-feedback" id="pass-error"></div>
          </div>

          <button type="submit" class="btn-auth-submit" id="login-submit-btn">Login</button>
        </form>

        <div class="auth-bottom-prompt">
          Don't have an account? <a href="signup.html" id="link-create-account">Create an account</a>
        </div>
      </div>
    </main>

    <!-- Empty footer buffer to balance center align -->
    <div style="height: 10px;"></div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
